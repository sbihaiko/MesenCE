# EnhancedAudioPresets.cfg - ear-tuning template for the Enhanced Audio synth.
#
# Copy this file to the Mesen home folder (the folder that holds settings.json;
# on macOS/Linux typically ~/Mesen2) as "EnhancedAudioPresets.cfg", un-comment
# the fields you want to change, tweak, then reset the console / reload the ROM
# to hear the result - no rebuild or restart needed. Fields left commented (or
# omitted) keep their built-in defaults.
#
# Sections are "<PresetName><EngineSuffix>", case-sensitive:
#   preset names:    Synthwave, ChipDeluxe, OrchestralLite, Dry, Studio
#   engine suffixes: (none) = NES, .Gb = Game Boy, .Sms = SMS/GG/SG-1000/CV
# e.g. [Studio] tunes the NES Studio preset, [Studio.Sms] the SMS one.
# Malformed lines and unknown fields are skipped silently.
#
# Field reference (defaults shown below are the SMS Studio built-ins):
#
#   Lead / harmony voices
#     LeadDetune       detune ratio of the lead's two oscillators (0.003 = +-0.3%)
#     HarmDetune       same for the harmony voice
#     FollowDuty       true: pulse width follows the game's duty register
#                      (NES/GB only - the SN76489 has no duty register)
#     FixedWidth       pulse width used when FollowDuty=false (0.5 = square)
#     LeadAlwaysSaw    true: lead is a fixed detuned-saw stack, width ignored
#     LeadOctaveUpMix  octave-up saw shimmer level added to the lead
#     LeadLpHz         lead lowpass cutoff (also filters the SMS FM bus)
#     HarmLpHz         harmony lowpass cutoff
#     LeadDrive        lead soft-clip drive (1.0 = clean, higher = fatter)
#
#   Bass voice
#     BassSine / BassSaw / BassSub   sine, saw and half-frequency sub levels
#     BassLpHz                       bass lowpass cutoff
#     BassDrive                      bass soft-clip drive
#
#   Drums (noise channel / SMS FM rhythm)
#     DrumBodyLoHz / DrumBodyHiHz    bandpass edges of the drum "body"
#     DrumTopHz                      highpass cutoff of the bright "top"
#     DrumBodyGain                   body level
#     ThumpGain / ThumpDecayS / ThumpFreqHz   attack-triggered low thump
#
#   Envelope smoothing
#     AttackMs / ReleaseMs           volume smoothing time constants
#
#   FX
#     EchoDelayS                     lead echo delay (seconds)
#     EchoGainL / EchoGainR          echo level per side (stereo image)
#     ReverbWet                      3-tap feedforward reverb level
#
#   Mix
#     LeadGain / HarmGain / BassGain / DrumGain   voice levels in the mix
#
#   Master bus compressor (Studio preset; 0 threshold = disabled)
#     CompThreshold    level where compression starts (0..~1)
#     CompRatio        compression ratio (clamped to >= 1)
#     CompAttackMs / CompReleaseMs   detector time constants
#     CompMakeup       output makeup gain

# ---------------------------------------------------------------------------
# SMS-family Studio preset - the values below ARE the built-in defaults
# (inherited from the NES tuning, never ear-calibrated for the SN76489).
# Un-comment and tweak from here. Likely first candidates: LeadLpHz/HarmLpHz
# (the PSG's plain 50% squares may want a darker or brighter voice than the
# 2A03's duty pulses), DrumBodyGain/ThumpGain (the PSG noise is narrower-range
# than the NES LFSR) and LeadDetune.
# ---------------------------------------------------------------------------
[Studio.Sms]
#LeadDetune=0.003
#HarmDetune=0.002
#FollowDuty=false
#FixedWidth=0.5
#LeadAlwaysSaw=true
#LeadOctaveUpMix=0.25
#LeadLpHz=5200
#HarmLpHz=3200
#LeadDrive=1.4
#BassSine=0.70
#BassSaw=0.45
#BassSub=0.35
#BassLpHz=900
#BassDrive=1.3
#DrumBodyLoHz=1400
#DrumBodyHiHz=6800
#DrumTopHz=6500
#DrumBodyGain=1.2
#ThumpGain=0.5
#ThumpDecayS=0.06
#ThumpFreqHz=165
#AttackMs=4
#ReleaseMs=4
#EchoDelayS=0.24
#EchoGainL=0.45
#EchoGainR=0.65
#ReverbWet=0.18
#LeadGain=1.0
#HarmGain=0.56
#BassGain=0.85
#DrumGain=0.75
#CompThreshold=0.55
#CompRatio=3.0
#CompAttackMs=8
#CompReleaseMs=140
#CompMakeup=1.18

# Same idea for the other SMS presets:
#[Synthwave.Sms]
#[ChipDeluxe.Sms]
#[OrchestralLite.Sms]
#[Dry.Sms]

# Game Boy engine (defaults also inherited from the NES tuning):
#[Studio.Gb]
#LeadLpHz=5200

# NES engine (already ear-tuned - the Studio preset is a port of the offline
# remaster mix; tweak only if you want to depart from it):
#[Studio]
#CompThreshold=0.55
