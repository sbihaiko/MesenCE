name: Community Pack Submitted

# Trigger-only workflow for the "Community HD/MEP Packs" triage pipeline.
# Deliberately thin: it only figures out *which* pack link and *which*
# validation mode apply, then hands both to the reusable
# `community-pack-validate.yml` workflow. All Project/Status/Pack-Hash
# manipulation, downloading, linting and classification lives there, not
# here, so this file stays reviewable on its own.
#
# Two ways in:
#   1. An Issue Form submission/edit carrying the `community-pack` label
#      (`issues: opened|edited`) -> mode: submit.
#   2. A comment whose body is EXACTLY `/revalidate` on an issue that
#      already carries the `community-pack` label -> mode: revalidate.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

# Serializes runs per issue. A newer `issues` trigger (opened/edited)
# supersedes a stale in-flight run for the same issue — that is the real
# fix for the self-trigger duplication (see the now-removed DEBUG step this
# replaced): the changes.body-based guard below assumed a title-only
# `gh issue edit --title` could never make GitHub report `changes.body`,
# but confirmed live (2026-08-27, issue #13, runs #42/#43) that assumption
# is false — GitHub sent `action: edited, changes: {body: {from: ""}}` for
# a pure title-only edit traced (via GH_DEBUG=api) to carry no body field
# in its mutation at all. Rather than depend on that unreliable signal,
# this group still cancels on `issues` so a second opened/edited trigger
# reruns against the same pack_url.
#
# `cancel-in-progress` is *not* true for `issue_comment`. The classify
# step posts a verdict comment, which fires this workflow's issue_comment
# trigger; with `cancel-in-progress: true` that cancelled the run that
# posted the comment, so the catalog-dispatch step never ran (F6.0,
# ADR-0138). `/revalidate` comments therefore queue behind an in-flight
# run instead of killing it. `issue_comment` payloads also carry
# `.issue.number`, so the same group key covers both trigger paths.
concurrency:
  group: community-pack-submitted-${{ github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'issues' }}

jobs:
  prepare:
    # Only issues (not PRs) carrying the community-pack label, and only an
    # exact "/revalidate" comment body (no partial/contains match) on such
    # an issue.
    # The "edited" branch is also fired by this very pipeline's own
    # "Rename issue title" / Project-field-writing steps further downstream
    # (gh issue edit --title triggers an issues.edited webhook like any
    # other edit) — without this guard, every validated submission
    # retriggers a second full validation of itself, forever converging
    # after 2 runs only because the rename becomes a no-op the second time
    # (confirmed live: issue #10 spawned overlapping runs #29/#31 from its
    # own title-rename). `changes.body` is only present on the webhook
    # payload when the issue's body actually changed, so a title-only (or
    # label-only) edit — anything our own automation does — is skipped;
    # a submitter editing their pack link/description still goes through.
    if: >
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'community-pack') &&
       (github.event.action != 'edited' || github.event.changes.body != null)) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.body == '/revalidate' &&
       contains(github.event.issue.labels.*.name, 'community-pack'))
    runs-on: ubuntu-latest
    outputs:
      pack_url: ${{ steps.extract.outputs.pack_url }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Extract pack URL from issue body
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          # The Issue Form renders the "Pack link" field as the first
          # http(s) URL in the structured body; grep it out defensively
          # rather than assuming a fixed line number.
          PACK_URL=$(printf '%s\n' "$ISSUE_BODY" | grep -oE 'https?://[^[:space:]]+' | head -n1 || true)
          if [ -z "$PACK_URL" ]; then
            echo "No pack URL found in the issue body (the 'Pack link' field)." >&2
            exit 1
          fi
          echo "pack_url=$PACK_URL" >> "$GITHUB_OUTPUT"

      - name: Determine validation mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "mode=revalidate" >> "$GITHUB_OUTPUT"
          else
            echo "mode=submit" >> "$GITHUB_OUTPUT"
          fi

  validate-submit:
    needs: prepare
    if: needs.prepare.outputs.mode == 'submit'
    uses: ./.github/workflows/community-pack-validate.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      pack_url: ${{ needs.prepare.outputs.pack_url }}
      mode: submit
    secrets: inherit

  validate-revalidate:
    needs: prepare
    if: needs.prepare.outputs.mode == 'revalidate'
    uses: ./.github/workflows/community-pack-validate.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      pack_url: ${{ needs.prepare.outputs.pack_url }}
      mode: revalidate
    secrets: inherit
