# .github/workflows/community-pack-drift-check.yml
#
# Daily drift check for community packs already accepted in Project 3
# ("MesenCE Community Packs", node id PVT_kwHOB1MsbM4BhjpN, owner sbihaiko).
# For each accepted item, re-downloads the stored `pack_url` and recomputes
# the hash with `curl`+`sha256sum` (without calling the Claude Code Action in
# this pre-check); only when the hash changed does this workflow comment on
# the issue and call the reusable `community-pack-validate.yml` workflow with
# `mode: revalidate`.
#
# The default Actions `GITHUB_TOKEN` does NOT have read/write permission on
# Projects v2 in a personal account — this workflow needs a classic PAT with
# `repo` + `project` + `read:org` scopes (`read:org` is also required by
# `gh project` commands to resolve the owner type even for a personal
# project — confirmed live via an "unknown owner type" failure without it)
# supplied manually in the repository secret `PROJECT_PAT` (same requirement
# documented in `community-pack-validate.yml`; this workflow does not create
# that secret, it only consumes it).
#
# --- gh project provenance (see AC-5) ---------------------------------------
# CONFIRMED live, primary source, in this run's Scout session
# (`gh project field-list 3 --owner sbihaiko --format json`):
#   - Status field:    PVTSSF_lAHOB1MsbM4BhjpNzhge86c
#     options: 5173b5cd (Novo envio), 51951f52 (Em validação),
#              227e4623 (Inválido), 39e4f3a1 (Aceito parcial HD Mesen),
#              cd763737 (Aceito MEP completo)
#   - Pack Hash field: PVTF_lAHOB1MsbM4BhjpNzhge9Is
#
# UNCONFIRMED - an explicit coverage gap, not an assumption presented as
# fact: `gh project item-list 3 --owner sbihaiko --format json`, in the same
# session, returned `{"items":[],"totalCount":0}` - Project 3 had ZERO
# items. The per-item JSON key names (how the Status value appears nested,
# how the Pack Hash text appears, how the source issue number appears) were
# never observed against real data - the gap is in the datastore itself (no
# populated item exists to inspect), not just in a cached view. Any "this key
# doesn't exist" conclusion below is necessarily provisional, not definitive,
# and the parsing below is deliberately defensive (multiple candidate keys,
# `// empty` fallback, never direct indexing) so it fails visibly - not
# silently - if the real schema diverges from the keys tried here.
# -----------------------------------------------------------------------------

name: Community Pack Drift Check

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    outputs:
      mismatched: ${{ steps.diff.outputs.mismatched }}
    env:
      GH_TOKEN: ${{ secrets.PROJECT_PAT }}
      REPO: sbihaiko/MesenCE
      STATUS_ACCEPTED_PARTIAL: "Aceito parcial (HD Mesen)"
      STATUS_ACCEPTED_FULL: "Aceito (MEP completo)"
      MAX_PACK_BYTES: 314572800 # 300MB, same cap as community-pack-validate.yml
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: List accepted project items
        run: |
          set -euo pipefail
          gh project item-list 3 --owner sbihaiko --format json > items.json

      - name: Recompute hash and diff against Pack Hash (curl + sha256sum only)
        id: diff
        run: |
          set -euo pipefail
          mismatched="[]"
          while IFS= read -r item; do
            # Defensive candidate keys: the per-item schema was never
            # observed against real data (see the provenance block above), so
            # we try the plausible variants with a `//` fallback instead of
            # direct indexing - a missing key becomes an empty string, not a crash.
            status=$(jq -r '.status // .["Status"] // empty' <<<"$item")
            case "$status" in
              "$STATUS_ACCEPTED_PARTIAL"|"$STATUS_ACCEPTED_FULL") ;;
              *) continue ;;
            esac

            issue_number=$(jq -r '.content.number // .number // empty' <<<"$item")
            stored_hash=$(jq -r '.["Pack Hash"] // .packHash // .pack_hash // empty' <<<"$item")
            if [ -z "$issue_number" ] || [ -z "$stored_hash" ]; then
              echo "::warning::item has no recognizable issue_number or Pack Hash among the candidate keys - skipping defensively"
              continue
            fi

            body=$(gh issue view "$issue_number" --repo "$REPO" --json body -q '.body')
            pack_url=$(printf '%s\n' "$body" | grep -Eo 'https?://[^ ")]+' | head -n1 || true)
            if [ -z "$pack_url" ]; then
              echo "::warning::issue #$issue_number has no detectable pack URL in the body - skipping"
              continue
            fi

            # scripts/fetch_pack.py re-applies the same host allow-list and
            # SSRF guard as community-pack-validate.yml's own download step
            # (defense in depth: if a host was later removed from the
            # allow-list, drift-check refuses to follow it too, instead of
            # blindly curling whatever URL is sitting in the issue body) and
            # handles host-specific quirks like Google Drive's two-step
            # confirm-token download the plain-curl version could not.
            rm -f drift_download.bin
            if ! python3 scripts/fetch_pack.py "$pack_url" drift_download.bin \
                --max-bytes "$MAX_PACK_BYTES" --allowlist scripts/pack_host_allowlist.json; then
              echo "::warning::issue #$issue_number - could not (re)download pack_url for drift check, skipping"
              continue
            fi
            fresh_hash=$(sha256sum drift_download.bin | cut -d' ' -f1)
            if [ "$fresh_hash" != "$stored_hash" ]; then
              gh issue comment "$issue_number" --repo "$REPO" \
                --body "the pack's content changed since the last validation — revalidating automatically"
              mismatched=$(jq -c --arg n "$issue_number" --arg u "$pack_url" \
                '. + [{"issue_number": ($n | tonumber), "pack_url": $u}]' <<<"$mismatched")
            fi
          done < <(jq -c '.items[]' items.json)

          echo "mismatched=$mismatched" >> "$GITHUB_OUTPUT"

  revalidate:
    needs: detect-drift
    if: needs.detect-drift.outputs.mismatched != '[]'
    strategy:
      matrix:
        item: ${{ fromJson(needs.detect-drift.outputs.mismatched) }}
    uses: ./.github/workflows/community-pack-validate.yml
    with:
      issue_number: ${{ matrix.item.issue_number }}
      pack_url: ${{ matrix.item.pack_url }}
      mode: revalidate
    secrets: inherit
