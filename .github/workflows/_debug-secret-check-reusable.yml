name: _debug-secret-check-reusable
on:
  workflow_call: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLAUDE_CODE_OAUTH_TOKEN length via secrets:inherit (never prints the value)
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is EMPTY via secrets:inherit"
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN is SET via secrets:inherit, length=${#TOKEN}"
          fi
