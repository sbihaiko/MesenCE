name: _debug-secret-check
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLAUDE_CODE_OAUTH_TOKEN length (never prints the value)
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is EMPTY in this context"
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN is SET, length=${#TOKEN}"
          fi
  check-via-reusable-call:
    uses: ./.github/workflows/_debug-secret-check-reusable.yml
    secrets: inherit
