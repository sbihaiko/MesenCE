# TEMPORARY diagnostic workflow — not part of the community-pack pipeline.
# Created to root-cause why secrets.PROJECT_PAT arrived empty inside
# community-pack-validate.yml when called via secrets: inherit from
# community-pack-submitted.yml (issues-triggered). Delete after use.
name: _debug secrets test

on:
  workflow_dispatch:

jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret directly (workflow_dispatch, no reusable-call hop)
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then echo "DIRECT: PROJECT_PAT is SET (len=${#GH_TOKEN})"; else echo "DIRECT: PROJECT_PAT is EMPTY"; fi

  via-reusable:
    uses: ./.github/workflows/community-pack-validate.yml
    with:
      issue_number: 3
      pack_url: "https://example.invalid/debug.zip"
      mode: submit
    secrets: inherit
