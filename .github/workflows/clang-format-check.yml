name: clang-format Check

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Run clang-format style check for C++.
      uses: jidicula/clang-format-action@v4.18.0
      with:
        clang-format-version: '20'
        check-path: './'
        # Vendored TinySoundFont (Utilities/Audio/tsf.h) is also wrapped in
        # clang-format off/on; keep it out of the gate so a wrap regression
        # does not dump 2k lines of vendor noise into the job log.
        exclude-regex: 'Utilities/Audio/tsf\.h$'
