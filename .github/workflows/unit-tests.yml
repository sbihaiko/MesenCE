name: Unit tests

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  ui-tests:
    # Fase 0 of the now-completed unit-test plan - see git history for
    # docs/roadmap/plano-testes-unitarios.md - cheap, cross-platform
    # dotnet test job. Deliberately independent of tests.yml (the Windows
    # ROM/PGOHelper suite) - no native build, no SDL2, no MesenCore.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Verify UI/Logic firewall
        # ADR-0123 (H5): fast pre-check naming the offending file/dependency;
        # the dual-compile below is still the authoritative gate.
        run: ./scripts/verify-ui-logic-firewall.sh

      - name: Run unit tests
        run: dotnet test UI.Tests/UI.Tests.csproj --nologo

      - name: Run core unit tests
        run: make core-unit-tests

  # ADR-0150 (accepted 2026-09-03): headless Avalonia XAML-wiring tests in a
  # separate project that references UI/UI.csproj. Kept as its own job - NOT a
  # step appended to ui-tests - so a headless-host failure never reds the cheap
  # host-free leg (ADR-0131's invariants for that job stay readable).
  # No MesenCore is built here (ADR-0131), so the MainWindow-backed cases
  # self-skip with an explicit reason via NativeCore.cs (Assert.SkipWhen); the
  # core-free wiring cases (PlayerSettingsTabs, ControllerHighlight) run. Run
  # `make core && make headless-ui-tests` locally to exercise all of them.
  # The RID is overridden from the command line because UI/UI.csproj hardcodes
  # <RuntimeIdentifier>win-x64</RuntimeIdentifier> (a global property wins over
  # the csproj assignment); linux-x64 matches the runner.
  headless-ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Run headless UI wiring tests
        run: dotnet test UI.HeadlessTests/UI.HeadlessTests.csproj -p:RuntimeIdentifier=linux-x64 --nologo
