name: Community pack catalog

# Regenerates docs/community-packs.md and docs/community-packs.json from
# the "MesenCE Community Packs" board (Project 3, owner sbihaiko, node id
# PVT_kwHOB1MsbM4BhjpN).
#
# Trigger: workflow_dispatch only in this file. community-pack-validate.yml
# also triggers this workflow (via `gh workflow run community-pack-catalog.yml`)
# when the final verdict is one of the two "Aceito*" (accepted) states — that
# call lives in the reusable workflow's file, not here.
#
# `gh project item-list` (used by scripts/generate_community_pack_catalog.py)
# requires Projects v2 read; the default GITHUB_TOKEN can't see Projects v2 in
# a personal repo, so this job needs a classic PAT with `repo` + `project` +
# `read:org` scopes (`read:org` is also required by `gh project` commands to
# resolve the owner type even for a personal project — confirmed live via an
# "unknown owner type" failure without it) configured manually as a repo
# secret (exact name: `PROJECT_PAT`).
# This secret is not created by this workflow nor by any automation.
on:
  workflow_dispatch:

# Every "Aceito*" verdict dispatches this workflow, so revalidating several
# packs at once used to start one run per pack, each checking out main,
# committing and pushing. On 2026-09-06 three such runs raced and the last
# one died on a non-fast-forward push. Serialize them instead; regeneration
# reads the live board and is idempotent, so a queued run that GitHub drops
# in favour of a newer one loses nothing.
concurrency:
  group: community-pack-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-catalog:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_PAT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate community-packs.md and community-packs.json
        run: python3 scripts/generate_community_pack_catalog.py

      - name: Commit regenerated catalog
        run: |
          set -euo pipefail
          git add -- docs/community-packs.md
          if [ -f docs/community-packs.json ]; then
            git add -- docs/community-packs.json
          fi
          if git diff --cached --quiet; then
            echo "docs/community-packs.md and docs/community-packs.json unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate docs/community-packs.md and docs/community-packs.json"
          # The concurrency group above keeps this workflow from racing
          # itself; this loop covers the remaining case of someone pushing
          # to main while the catalog was being generated. Rebase rather
          # than merge: the commit only ever touches the two generated
          # files, so it replays cleanly onto whatever landed meanwhile.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) - rebasing onto the new main and retrying"
            git pull --rebase --no-edit origin main
          done
          echo "push still rejected after 3 attempts" >&2
          exit 1
