name: Community pack catalog

# Regenerates docs/community-packs.md from the "MesenCE Community
# Packs" board (Project 3, owner sbihaiko, node id PVT_kwHOB1MsbM4BhjpN).
#
# Trigger: workflow_dispatch only in this file. community-pack-validate.yml
# also triggers this workflow (via `gh workflow run community-pack-catalog.yml`)
# when the final verdict is one of the two "Aceito*" (accepted) states — that
# call lives in the reusable workflow's file, not here.
#
# `gh project item-list` (used by scripts/generate_community_pack_catalog.py)
# requires Projects v2 read; the default GITHUB_TOKEN can't see Projects v2 in
# a personal repo, so this job needs a classic PAT with `repo` + `project` +
# `read:org` scopes (`read:org` is also required by `gh project` commands to
# resolve the owner type even for a personal project — confirmed live via an
# "unknown owner type" failure without it) configured manually as a repo
# secret (exact name: `PROJECT_PAT`).
# This secret is not created by this workflow nor by any automation.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-catalog:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_PAT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Generate community-packs.md
        run: python3 scripts/generate_community_pack_catalog.py

      - name: Commit regenerated catalog
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/community-packs.md; then
            echo "docs/community-packs.md unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/community-packs.md
          git commit -m "chore: regenerate docs/community-packs.md"
          git push
