name: "Community HD/MEP Pack Submission"
description: >-
  Submit a community-made HD Pack or MEP Pack (textures, audio, and/or
  synth) for triage on the "MesenCE Community Packs" board.
title: "[Pack] "
labels:
  - community-pack
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, read the pack authoring guide:
        https://github.com/sbihaiko/MesenCE/blob/main/docs/hd-pack-authoring.md
        (`docs/hd-pack-authoring.md`) — it explains what makes a pack
        "Aceito (MEP completo)" vs. "Aceito parcial (HD Mesen)", and what
        causes a rejection ("Inválido").

        After you open the issue, an automated workflow downloads the
        linked pack, validates its structure, and classifies the
        submission. Comment `/revalidate` on this issue after updating the
        pack to trigger a new validation pass.
  - type: input
    id: pack_link
    attributes:
      label: "Pack link"
      description: >-
        Direct download URL for the pack (GitHub release, gist, or raw
        githubusercontent). E.g.: https://github.com/<user>/<repo>/releases/...
      placeholder: "https://github.com/<user>/<repo>/releases/download/..."
    validations:
      required: true
  - type: input
    id: rom_target
    attributes:
      label: "Target game/ROM and region"
      description: "Name of the game and ROM region this pack applies to."
      placeholder: "E.g.: After Burner (World)"
    validations:
      required: true
  - type: dropdown
    id: console
    attributes:
      label: "Console"
      description: "Target system for the pack."
      options:
        - NES
        - GB
        - GBC
        - SMS
        - Other
    validations:
      required: true
  - type: input
    id: author_credits
    attributes:
      label: "Author/credits"
      description: "Pack author(s) and any third-party credits."
      placeholder: "E.g.: your-github-username, with textures by someone-else"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description (optional)"
      description: >-
        Any additional details: what the pack covers, tools used, special
        installation instructions, etc.
    validations:
      required: false
  - type: textarea
    id: external_assets
    attributes:
      label: "External assets (optional)"
      description: >-
        Assets not included in the pack link above (e.g. large audio
        files hosted separately). One dependency per non-empty line;
        blank lines and lines whose first non-space character is `#` are
        ignored. Format: `<url> [<sha256>] [<size>]` — `sha256` is 64
        lowercase hex characters, `size` is in decimal bytes. A line
        missing the `sha256` disables recipe assembly for the whole
        submission.
      placeholder: |
        https://example.com/asset.zip 3b1e...c0 1048576
    validations:
      required: false
  - type: input
    id: external_assets_license
    attributes:
      label: "External assets license (optional)"
      description: >-
        License or usage terms covering the external assets listed above.
      placeholder: "E.g.: CC-BY-4.0, all rights reserved to original author"
    validations:
      required: false
